# Shot scoring weights and coaching messages

severity_weights:
  error: 3
  warning: 2
  info: 1

min_evaluated_rules: 2
max_coaching_tips: 3

# REMOVED: summary_display_frames.
# It was defined here AND in display.yaml, and pipeline.py reads display.yaml
# first, so this copy never took effect. Both happened to hold 60, which is
# why nothing ever looked wrong -- and is exactly what makes a shadowed
# setting dangerous: the next person edits the copy that does nothing.
# It is an overlay-timing setting, so display.yaml is its right home.

score_messages:
  excellent: 90
  good: 75
  fair: 60
  excellent_msg: "Excellent mechanics — keep this rhythm."
  good_msg: "Solid form. Refine the notes above."
  fair_msg: "Fair attempt — focus on one correction per rep."
  needs_work_msg: "Break the shot into phases and practice each slowly."
