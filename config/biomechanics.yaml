# Biomechanical rules for basketball shooting practice.
#
# ---------------------------------------------------------------------------
# HOW A RULE IS EVALUATED  (three tiers, not pass/fail)
# ---------------------------------------------------------------------------
#   outside min..max        -> NEEDS WORK  : message_low / message_high
#   inside  min..max        -> GOOD        : refine_low / refine_high
#   inside  ideal_min..max  -> EXCELLENT   : message_excellent
#
# The GOOD tier is directional on purpose: a value under the ideal band needs
# the opposite correction from one over it, so a single "refine this" message
# would be useless or actively wrong.
#
# ---------------------------------------------------------------------------
# HOW MESSAGES ARE WRITTEN  (external focus)
# ---------------------------------------------------------------------------
# Messages point at the EFFECT of the movement or an external target (the rim,
# the floor, the ball), not at body parts. Focusing attention externally
# produces better motor learning and retention than focusing on the limb
# itself -- one of the most replicated findings in motor learning, tested on
# basketball free throws specifically (constrained-action hypothesis; see
# resources.md Part C).
#
#   internal (weaker):  "Bend your knees deeper"
#   external (better):  "Drive the floor away as you rise"
#
# Keep them formal, short and plain. No slang. A player who has never had
# coaching should understand every word.
#
# ---------------------------------------------------------------------------
# EVIDENCE LABELS
# ---------------------------------------------------------------------------
# Every rule carries `evidence:` naming its class, per resources.md Part E:
#   DIRECTLY SUPPORTED / SUPPORTED WITH LIMITATIONS / INFERRED /
#   ENGINEERING DECISION / NOT SUPPORTED
# Thresholds labelled ENGINEERING DECISION are our choices, NOT published
# biomechanical norms. Do not present them as science.
#
# `scored: false` means the metric is measured and shown to the player but
# deliberately excluded from the score, because the evidence or the
# measurement quality does not justify penalising anyone for it.
#
# Angle convention: INTERNAL angles. A SMALLER knee/elbow number means MORE
# bend. All angles in degrees unless `unit` says otherwise.

rules:

  # ---------------------------------------------------------------- loading
  knee_flexion_loading:
    name: "Leg Load"
    metric: knee
    phases: [loading]
    min: 80
    max: 145
    ideal_min: 100
    ideal_max: 128
    severity: info
    scored: true
    message_excellent: "Good load. That shot's powered from the floor, which is what you want."
    refine_low: "Your legs are loading well. Sink slightly less so you can rise in one smooth motion."
    refine_high: "Your leg load is good. Sit a little deeper before you rise to build more lift."
    message_low: "You're bending your knees too deep, so there's a pause at the bottom. Come up a little higher and keep it flowing."
    message_high: "Bend your knees a bit deeper before you rise. Right now the arm is doing the work — let your legs send the ball up."
    evidence: >
      NOT SUPPORTED as a proficiency discriminator. This is now the most
      thoroughly contradicted claim in the project, and the position has
      only hardened with additional sources.

      Non-significant in three independent samples at the preparatory phase:
          free throw,  N=34  113.3 (9.1) vs 107.3 (14.9)   p=0.549
          two-point,   N=18  115.6 (10.9) vs 113.8 (6.3)   p=0.672
          three-point, N=18  109.6 (5.8) vs 109.2 (11.6)   p=0.925
      Against that: proficient shooters loaded deeper at 3-point range in one
      earlier sample (p<0.001), and one report associates LOWER preparatory
      flexion with successful shooting — the opposite direction again.

      DO NOT read the three non-significant p-values as proof of "no
      difference". At n=18-34 they are evidence of low statistical power, not
      of equivalence. The honest statement is that no consistent proficiency
      effect has been demonstrated in either direction.

      What IS consistent is the RANGE. Every sample lands between roughly
      107 and 116 deg at the preparatory phase, and knee angle deepens
      reliably with shooting distance (114.8 deg at 5.10 m vs 109.4 deg at
      6.32 m, p<0.001). So the band is defensible as a description of what
      shooters do; it is not defensible as a description of what wins.

      Band is an ENGINEERING DECISION spanning published values (94-122 deg),
      kept at `info` severity so it informs without penalising.
      resources.md D3; PMC10436204, PMC10531893.

  hip_hinge_loading:
    name: "Hip Drive"
    metric: hip
    phases: [loading]
    min: 110
    max: 168
    ideal_min: 125
    ideal_max: 152
    severity: info
    scored: true
    message_excellent: "Hips are set well — chest tall, weight balanced over your feet."
    refine_low: "Your hip position is good. Open the hips slightly so your chest lifts toward the rim."
    refine_high: "Your hips are good. Send them back a little further to load more power."
    message_low: "You're folding forward at the waist. Keep your chest up toward the rim as you sink."
    message_high: "Your hips stay too upright to build power. Push them back as you lower, like you're sitting onto a high stool."
    evidence: >
      SUPPORTED WITH LIMITATIONS — the best-supported LOWER-BODY rule here,
      and notably better supported than the knee.

      Hip angle at the preparatory phase separated proficiency in a second,
      independent sample: Cabarkapa et al. (2023), N=18 female players,
      two-point range 5.10 m —
          proficient (>=50% made)      136.9 deg (SD 6.2)
          non-proficient (<50% made)   128.6 deg (SD 10.0)   p=0.048
      i.e. the better shooters were LESS folded at the hip, not more.

      It also separated proficiency at 3-point range in the earlier sample
      (143.1 vs 155.9 deg, p<0.001), and it deepens systematically with
      distance (133.2 deg at 5.10 m vs 126.3 deg at 6.32 m, p<0.001), which
      is a dose-response pattern rather than a one-off difference.

      LIMITATIONS: p=0.048 is marginal; n=18; one research group; and the two
      samples disagree on DIRECTION (the female two-point sample favours a
      more open hip, the earlier 3-point sample a more closed one). That
      disagreement is why the band stays wide and severity stays `info`
      rather than being tightened around either mean.

      resources.md A1, A3; PMC10531893, PMC10436204.

  # -------------------------------------------------------------- ball lift
  elbow_slot_ball_lift:
    name: "Ball Set Position"
    metric: elbow
    phases: [ball_lift]
    min: 60
    max: 118
    ideal_min: 74
    ideal_max: 98
    severity: warning
    scored: true
    message_excellent: "The ball's in a strong spot to launch from."
    refine_low: "Good set position. Let the ball sit a touch further from your chest before you lift."
    refine_high: "Good set position. Bring the ball slightly closer in before you lift."
    message_low: "Your elbow is tucked in too tight to your body. Give it a bit of room so the ball can travel straight up."
    message_high: "Your elbow is flared out too far, so the ball swings on the way up. Bring it in under the ball."
    evidence: >
      ENGINEERING DECISION informed by thin evidence. Published set-point
      values do not vary systematically with distance or skill, but that
      rests on non-significant results (p=0.471, p=0.706) from samples of
      10-34 in one laboratory — which is low statistical power, NOT
      demonstrated invariance. Treated as a tunable prior. resources.md D2.

  shoulder_alignment_lift:
    name: "Shoulder Elevation"
    metric: shoulder
    phases: [ball_lift, jump]
    min: 55
    max: 135
    severity: info
    scored: false          # measured and displayed, never scored
    message_excellent: "Shoulder elevation, for reference — this one isn't scored."
    message_low: "Shoulder elevation, for reference — this one isn't scored."
    message_high: "Shoulder elevation, for reference — this one isn't scored."
    evidence: >
      NOT SUPPORTED FOR SCORING — held back by MEASUREMENT, not by biology.
      This distinction matters, because the biomechanical evidence here is
      now stronger than for the knee, which IS scored.

      Shoulder angle at the preparatory phase separated proficiency:
      Cabarkapa et al. (2023), N=18 female players, two-point range —
          proficient (>=50% made)      52.3 deg (SD 11.6)
          non-proficient (<50% made)   63.8 deg (SD 6.7)    p=0.025
      i.e. better shooters carried a LOWER shoulder. It also decreases with
      distance (57.4 deg at 5.10 m vs 54.2 deg at 6.32 m, p=0.006).

      WHY IT STAYS UNSCORED ANYWAY: single-camera shoulder angle carries a
      bias of -16 to -26 deg and RMSE of 24-36 deg depending on camera
      azimuth. The published proficiency gap is 11.5 deg — roughly half our
      measurement error. We would be scoring noise. Displayed for
      observability only.

      NOTE ON THE RANGE: min/max 55-135 predates this evidence and implies
      that a high shoulder is acceptable while a low one is not, which is
      backwards relative to the finding above (proficient mean 52.3 sits
      BELOW our minimum). The range is left unchanged on purpose, because
      changing display bounds on an unscored rule would alter what the
      report shows without improving what it knows. Revisit together with
      the camera-geometry limitation, not before.

      resources.md D4; PMC10531893.

  trunk_posture:
    name: "Upper Body Posture"
    metric: trunk
    phases: [ready_stance, loading, ball_lift, jump, release]
    min: 0
    max: 25
    ideal_min: 0
    ideal_max: 13
    severity: warning
    scored: true
    message_excellent: "You stay tall and square the whole way through."
    refine_high: "Your posture is good. Stay a little taller through the top of the shot to keep the ball on line."
    message_high: "You're leaning your upper body through the shot, and it pulls the ball off line. Keep your chest facing the rim start to finish."
    evidence: >
      SUPPORTED WITH LIMITATIONS. Reduced forward trunk lean at release
      distinguished proficient free-throw shooters. Trunk lean is measured
      against a fixed vertical axis, so it depends on the coordinate
      convention — see docs/ACCEPTANCE_Y_AXIS.md. resources.md A2.

  head_stability:
    name: "Eyes and Head"
    metric: head_velocity
    phases: [loading, ball_lift, jump, release]
    max: 0.08
    ideal_max: 0.05
    unit: "m/s"
    severity: info
    scored: true
    message_excellent: "Your head stays still, so your eyes stay on target."
    refine_high: "Head control is good. Hold your eyes on the rim a moment longer after the ball leaves."
    message_high: "You're moving your head mid-shot. Lock your eyes on the front of the rim and keep them there until the ball lands."
    evidence: >
      ENGINEERING DECISION. No published threshold for head movement during
      shooting was found. Retained because a stable gaze is standard coaching
      practice and the measurement is reliable. Threshold is ours.

  # ---------------------------------------------------------------- release
  elbow_extension_release:
    name: "Reach at Release"
    metric: elbow
    phases: [release]
    min: 142
    max: 180
    ideal_min: 152
    ideal_max: 168
    severity: warning
    scored: true
    message_excellent: "You reach all the way to the rim at release."
    refine_low: "Good reach. Extend a little further toward the rim to lift the arc."
    refine_high: "Good reach. Ease off the very end of the extension so the release stays smooth."
    message_low: "Straighten your elbow more at release. It's still bent when the ball leaves, and that flattens the arc."
    message_high: "You're snapping your elbow straight too hard. Reach toward the rim and let the arm finish soft."
    evidence: >
      SUPPORTED WITH LIMITATIONS — and the strongest numeric anchor in this
      file.

      Cabarkapa et al. (2023), markerless mocap at 120 Hz, N=34 free-throw
      shooters, elbow angle AT BALL RELEASE:
          proficient (>=70% made, n=19)      159.6 deg (SD 1.4)
          non-proficient (<70% made, n=15)   159.8 deg (SD 1.3)

      Two things follow, and they must not be confused.

      1. The value is a CONVERGENCE NORM, not a proficiency discriminator.
         An SD of 1.3-1.4 deg across 34 shooters is extremely tight: everyone
         releases near 160 deg. But the two groups are indistinguishable
         (p=0.336 at the preparatory phase; the release means differ by
         0.2 deg), so a player matching 160 deg has a NORMAL release, not a
         good one. The rule may say "this is where the ball should leave";
         it may NOT say "this is why you make shots".

      2. The literature band is far tighter than we can measure. +/-3 SD is
         roughly 155.5-163.7 deg. We do not reproduce 1.4 deg precision:
         release is located to within one frame at 24-30 fps, and
         single-camera elbow error is around 17 deg RMSD in a
         basketball-throwing validation. The ideal band is therefore
         deliberately WIDENED to 152-168 (centred on 160) to absorb our own
         measurement error. Narrowing it to the published SD would be
         borrowing a precision we do not have.

      Also note 180 deg is NOT the target. Full lockout is outside the norm
      in both groups, which is why message_high exists.

      resources.md A3, D4; Cabarkapa et al. 2023 (PMC10436204).

  index_alignment_release:
    name: "Finger Direction"
    metric: index_align
    phases: [release]
    min: 148
    max: 180
    ideal_min: 160
    ideal_max: 180
    severity: warning
    scored: true
    message_excellent: "The ball comes off your fingertips clean."
    refine_low: "Good release. Push a little further through the fingertips to add backspin."
    message_low: "Snap your wrist down through the ball at release. Right now it's coming off a flat hand."
    evidence: >
      ENGINEERING DECISION. No published norm for an elbow-wrist-index
      alignment angle was found; this is a Swichy-defined proxy for a clean
      fingertip release. Thresholds are ours.

  release_height:
    name: "Release Height"
    metric: release_height
    phases: [release]
    min: 0.06
    max: 0.62
    ideal_min: 0.16
    ideal_max: 0.46
    unit: "m"
    severity: warning
    scored: true
    message_excellent: "Nice high release — that protects the shot and steepens the arc."
    refine_low: "Release point is good. Let the ball go slightly higher to steepen the arc."
    refine_high: "Release point is good and high. Keep it there without over-reaching."
    message_low: "You're letting it go too early, low in the motion. Release at the top of your rise, not on the way up."
    message_high: "You're over-reaching at release and losing control. Let it go a touch earlier."
    evidence: >
      SUPPORTED WITH LIMITATIONS. Release height was the only variable that
      separated proficient from non-proficient free-throw shooters (p=0.010),
      while release ANGLE did not (p=0.179); independently replicated. This
      metric is measured relative to the head, so it is scale-free and works
      without a recorded player height. resources.md A2, A6.

  release_height_ratio:
    name: "Release Height (relative to your height)"
    metric: release_height_ratio
    phases: [release]
    min: 1.02
    max: 1.58
    ideal_min: 1.14
    ideal_max: 1.46
    unit: ""
    severity: info
    scored: true
    message_excellent: "Strong release height for your build."
    refine_low: "Good release height for your build. A little more lift would steepen the arc further."
    refine_high: "Your release is high for your build. Keep it repeatable rather than pushing higher."
    message_low: "Your release is low for your height. Let it go at the top of your rise to get more arc."
    message_high: "That release reads unusually high for your height — check your whole body is in frame."
    evidence: >
      SUPPORTED WITH LIMITATIONS. Published release heights are reported ONLY
      as a ratio of body height (1.12 non-proficient vs 1.17 proficient,
      p=0.010), which is why this rule exists alongside the head-relative one.
      SKIPPED ENTIRELY when no player height is provided — never estimated
      from the camera. resources.md A2, B2, B3.

  # --------------------------------------------------------- follow-through
  follow_through_elbow:
    name: "Follow-Through"
    metric: elbow
    phases: [follow_through]
    min: 145
    max: 180
    ideal_min: 155
    ideal_max: 180
    severity: warning
    scored: true
    message_excellent: "You hold the finish well after the ball's gone."
    refine_low: "Good finish. Hold the reach toward the rim a moment longer."
    message_low: "Keep your elbow up after the ball leaves. It drops straight away — hold the reach toward the rim until the ball gets there."
    evidence: >
      ENGINEERING DECISION. Holding the follow-through is standard coaching
      practice; no published angular threshold was found. Thresholds are ours.

  follow_through_index:
    name: "Finish Position"
    metric: index_align
    phases: [follow_through]
    min: 150
    max: 180
    ideal_min: 162
    ideal_max: 180
    severity: warning
    scored: true
    message_excellent: "Your hand finishes pointing into the rim. That's it — hold it there."
    refine_low: "Good finish. Let the fingers relax further down toward the floor."
    message_low: "Your wrist stops flat after release. Finish with your fingers pointing down into the front of the rim, and hold it a second."
    evidence: >
      ENGINEERING DECISION. Same basis as follow_through_elbow. Thresholds are ours.

  # ---------------------------------------------------------------- landing
  landing_balance:
    name: "Landing"
    metric: ankle_rise
    phases: [landing]
    min: -0.06
    max: 0.06
    ideal_min: -0.03
    ideal_max: 0.03
    unit: "m"
    severity: info
    scored: true
    message_excellent: "You land settled, with your legs back under you."
    refine_low: "Settled landing. Let the knees absorb a little more on the way down."
    refine_high: "Settled landing. Let the knees absorb a little more on the way down."
    message_low: "You're still sinking when the shot ends. Absorb the landing and come back to a balanced stance."
    message_high: "You land stiff, without absorbing. Let the knees give a little as you come down."
    evidence: >
      ENGINEERING DECISION. Thresholds are ours; no published value was found.

      CORRECTED CLAIM: this rule previously said "you're drifting on the
      landing — land where you took off". That is a HORIZONTAL claim, but the
      metric `ankle_rise` is VERTICAL (ankle height minus standing baseline),
      so the message described something the rule never measured. The wording
      now matches the measurement.

      KNOWN LIMITATION: `ankle_rise` is computed from hip-centred world
      landmarks, where it tracks leg extension rather than the body's height
      above the floor. It is a weak proxy for "settled". Measuring genuine
      take-off-to-landing drift needs the horizontal image-space signal
      (`hip_x_ratio`) compared across the jump and landing phases, which the
      per-frame rule engine cannot express today. Severity is `info` partly
      for this reason.
