# Performance / hardware acceleration

# MediaPipe delegate: cpu | gpu | auto
# GPU works on Linux/macOS only. Windows Python builds are CPU-only.
pose_delegate: auto

# Model size: lite (fastest) | full (balanced) | heavy (most accurate)
pose_model: full

# Download URLs if model file is missing (see README)
# lite:  pose_landmarker_lite.task
# full:  pose_landmarker_full.task
# heavy: pose_landmarker_heavy.task
