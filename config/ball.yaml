# Phase 6 — ball detection and outcome settings (not wired yet)

enabled: false

detector:
  backend: color  # color | yolo
  min_confidence: 0.5
  min_radius_px: 8
  max_radius_px: 80

tracking:
  max_missing_frames: 3

outcome:
  post_shot_capture_ms: 2000
  min_flight_frames: 3

release_sync:
  max_body_ball_frame_delta: 3
  ball_wrist_release_distance_px: 40
